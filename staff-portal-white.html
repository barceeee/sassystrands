<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Portal | Sassy Strands</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --white: #ffffff;
      --soft: #fafafa;
      --off: #f6f6f4;
      --border: #e5e5e5;
      --text: #1d1d1d;
      --muted: #737373;
      --black: #111111;
      --green: #06451d;
      --green-hover: #0b6a2d;
      --lime: #22d834;
      --success-bg: #eaf7ed;
      --success-text: #176b2e;
      --warning-bg: #fff5d8;
      --warning-text: #875f00;
      --danger-bg: #fde8e5;
      --danger-text: #a23b2c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--white);
      color: var(--text);
      font-family: "Source Serif 4", Georgia, serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .portal-shell {
      display: grid;
      grid-template-columns: 255px 1fr;
      min-height: 100vh;
      background: white;
    }

    .sidebar {
      position: relative;
      min-height: 100vh;
      padding: 24px 15px;
      background: white;
      border-right: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      padding: 0 8px 22px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--black);
      color: white;
      font-size: 20px;
      font-weight: 700;
    }

    .brand strong {
      display: block;
      color: var(--black);
      font-size: 20px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
    }

    .user-card {
      margin: 20px 7px;
      padding: 13px;
      border: 1px solid var(--border);
      background: var(--soft);
    }

    .user-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .user-card b {
      color: var(--black);
      font-size: 17px;
    }

    .side-nav {
      width: 100%;
      margin: 2px 0;
      padding: 12px 10px;
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: #383838;
      text-align: left;
      font-size: 15px;
    }

    .side-nav:hover {
      background: var(--off);
      color: var(--black);
    }

    .side-nav.active {
      background: var(--black);
      color: white;
    }

    .side-nav small {
      float: right;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
    }

    .side-nav.active small {
      color: white;
    }

    .logout {
      position: absolute;
      bottom: 22px;
      left: 22px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: white;
      color: var(--black);
    }

    .logout:hover {
      border-color: var(--black);
    }

    .main {
      padding: 36px;
      background: white;
      overflow: auto;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 26px;
      border-bottom: 1px solid var(--border);
    }

    .top h1 {
      margin: 0;
      color: var(--black);
      font-size: 34px;
      font-weight: 500;
      line-height: 1;
    }

    .top p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .role {
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--off);
      color: var(--black);
      font-size: 14px;
      font-weight: 700;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 27px 0;
    }

    .stat {
      padding: 18px;
      border: 1px solid var(--border);
      background: white;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    .stat b {
      display: block;
      margin-top: 5px;
      color: var(--black);
      font-size: 30px;
    }

    .stat.emphasis {
      border-color: var(--green);
    }

    .stat.emphasis b {
      color: var(--green);
    }

    .content {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
    }

    .panel {
      padding: 18px;
      border: 1px solid var(--border);
      background: white;
    }

    .panel h2 {
      margin: 0 0 14px;
      color: var(--black);
      font-size: 21px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      text-align: left;
      color: var(--muted);
      font-size: 12px;
    }

    th,
    td {
      padding: 12px 6px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr:hover {
      background: var(--soft);
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
    }

    .ready {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .progress {
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .qa {
      background: #e6f2ff;
      color: #1b5d9f;
    }

    .low {
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .permission-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .permission-list li {
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      color: #444444;
    }

    .permission-list li::before {
      content: "✓";
      margin-right: 9px;
      color: var(--green);
      font-weight: bold;
    }

    .report-box {
      margin-top: 18px;
      padding: 20px;
      background: var(--black);
      color: white;
    }

    .report-box p {
      margin: 5px 0 14px;
      color: #d8d8d8;
    }

    .report-box button,
    .mini-add {
      padding: 8px 11px;
      border: 0;
      border-radius: 2px;
      background: var(--green);
      color: white;
      font-size: 13px;
    }

    .report-box button {
      border: 1px solid white;
      background: transparent;
    }

    .report-box button:hover {
      background: white;
      color: var(--black);
    }

    .mini-add:hover {
      background: var(--green-hover);
    }

    .module-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .portal-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: flex;
        min-height: auto;
        gap: 6px;
        overflow: auto;
        padding: 14px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .brand,
      .user-card {
        display: none;
      }

      .side-nav {
        width: auto;
        white-space: nowrap;
      }

      .logout {
        position: static;
        margin-left: auto;
        white-space: nowrap;
      }

      .main {
        padding: 22px;
      }

      .stat-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 460px) {
      .main {
        padding: 16px;
      }

      .top {
        align-items: start;
        flex-direction: column;
      }

      .top h1 {
        font-size: 28px;
      }

      .stat-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="portal-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>

        <div>
          <strong>Sassy Strands</strong>
          <small>STAFF MANAGEMENT</small>
        </div>
      </div>

      <div class="user-card">
        <span>Prototype signed in as</span>
        <b id="roleName">Staff member</b>
      </div>

      <div id="sideNav"></div>

      <button class="logout" onclick="logout()">Sign out</button>
    </aside>

    <main class="main">
      <div class="top">
        <div>
          <h1 id="title">Operations Dashboard</h1>
          <p id="subtitle">Your assigned Sassy Strands workspace.</p>
        </div>

        <span id="roleBadge" class="role">ROLE</span>
      </div>

      <div id="content"></div>
    </main>
  </div>

  <script>
    const navItems = {
      dashboard: "Dashboard",
      inventory: "Inventory",
      production: "Production",
      qa: "Quality Assurance",
      or: "OR Numbers",
      reports: "Reports",
      users: "Users",
    };

    const counts = {
      inventory: "12 low",
      production: "18",
      qa: "7",
    };

    const roleModules = {
      Owner: [
        "dashboard",
        "inventory",
        "production",
        "qa",
        "or",
        "reports",
        "users",
      ],

      Admin: [
        "dashboard",
        "inventory",
        "production",
        "qa",
        "or",
        "reports",
        "users",
      ],

      Inventory: [
        "dashboard",
        "inventory",
        "production",
        "qa",
        "or",
        "reports",
      ],

      Production: [
        "dashboard",
        "production",
      ],

      QA: [
        "dashboard",
        "production",
        "qa",
      ],
    };

    const roleAccess = {
      Owner: [
        "Dashboard overview",
        "Manage users and roles",
        "Manage OR numbers",
        "Manage inventory",
        "Manage production",
        "Manage QA",
        "View all reports",
      ],

      Admin: [
        "Dashboard overview",
        "Manage users and roles",
        "Manage OR numbers",
        "Manage inventory",
        "Manage production",
        "Manage QA",
        "View all reports",
      ],

      Inventory: [
        "Inventory management",
        "Manage OR numbers",
        "Manage production records",
        "Manage QA records",
        "View reports",
      ],

      Production: [
        "Production records only",
        "Update RSB",
        "Update wefting",
        "Update curling",
        "Update ventilation",
        "Update production status",
      ],

      QA: [
        "View production records",
        "Manage QA records",
        "Record inspection results",
        "Approve or reject finished products",
      ],
    };

    const role =
      sessionStorage.getItem("sassyStrandsDemoRole") || "Production";

    let tab = "dashboard";

    function renderNav() {
      document.getElementById("roleName").textContent = role + " account";
      document.getElementById("roleBadge").textContent = role;

      document.getElementById("sideNav").innerHTML = roleModules[role]
        .map((module) => {
          return `
            <button
              class="side-nav ${module === tab ? "active" : ""}"
              onclick="selectTab('${module}')"
            >
              ${navItems[module]}
              ${counts[module] ? `<small>${counts[module]}</small>` : ""}
            </button>
          `;
        })
        .join("");
    }

    function selectTab(module) {
      if (!roleModules[role].includes(module)) {
        return;
      }

      tab = module;

      renderNav();
      renderContent();
    }

    function renderContent() {
      const titles = {
        dashboard: "Operations Dashboard",
        inventory: "Inventory Management",
        production: "Production Tracker",
        qa: "Quality Assurance",
        or: "OR Number Management",
        reports: "Reports Center",
        users: "User Management",
      };

      document.getElementById("title").textContent = titles[tab];

      document.getElementById("subtitle").textContent =
        `${role} workspace · Only modules assigned to your role are available.`;

      const content = document.getElementById("content");

      if (tab === "dashboard") {
        content.innerHTML = `
          <div class="stat-grid">
            <div class="stat emphasis">
              <span>Finished inventory</span>
              <b>423</b>
            </div>

            <div class="stat">
              <span>In production</span>
              <b>18</b>
            </div>

            <div class="stat">
              <span>Awaiting QA</span>
              <b>7</b>
            </div>

            <div class="stat">
              <span>Low stock alerts</span>
              <b>12</b>
            </div>
          </div>

          <div class="content">
            <section class="panel">
              <h2>Production status</h2>

              <table>
                <thead>
                  <tr>
                    <th>Record</th>
                    <th>Product</th>
                    <th>Stage</th>
                    <th>Status</th>
                  </tr>
                </thead>

                <tbody>
                  <tr>
                    <td>PR-24091</td>
                    <td>22 in Natural Wavy</td>
                    <td>Ventilation</td>
                    <td>
                      <span class="status progress">In progress</span>
                    </td>
                  </tr>

                  <tr>
                    <td>PR-24092</td>
                    <td>18 in Straight Bundle</td>
                    <td>QA inspection</td>
                    <td>
                      <span class="status qa">Ready for QA</span>
                    </td>
                  </tr>

                  <tr>
                    <td>PR-24093</td>
                    <td>13×4 HD Frontal</td>
                    <td>Finished</td>
                    <td>
                      <span class="status ready">Approved</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </section>

            <section class="panel">
              <h2>Your access</h2>

              <ul class="permission-list">
                ${roleAccess[role]
                  .map((access) => `<li>${access}</li>`)
                  .join("")}
              </ul>
            </section>
          </div>
        `;
      }

      if (tab === "inventory") {
        content.innerHTML = `
          <div class="stat-grid">
            <div class="stat">
              <span>Raw hair units</span>
              <b>1,248</b>
            </div>

            <div class="stat">
              <span>Finished items</span>
              <b>423</b>
            </div>

            <div class="stat emphasis">
              <span>Low stock</span>
              <b>12</b>
            </div>

            <div class="stat">
              <span>Stock movements</span>
              <b>36</b>
            </div>
          </div>

          <section class="panel">
            <h2>Inventory alerts</h2>

            <table>
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Variant</th>
                  <th>On hand</th>
                  <th>Status</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>Natural Wavy Bundle</td>
                  <td>22 in</td>
                  <td>4</td>
                  <td>
                    <span class="status low">Low stock</span>
                  </td>
                </tr>

                <tr>
                  <td>HD Lace Closure</td>
                  <td>5×5 · 14 in</td>
                  <td>9</td>
                  <td>
                    <span class="status progress">Reorder soon</span>
                  </td>
                </tr>

                <tr>
                  <td>Natural Straight Bundle</td>
                  <td>18 in</td>
                  <td>28</td>
                  <td>
                    <span class="status ready">Available</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </section>
        `;
      }

      if (tab === "production") {
        content.innerHTML = `
          <div class="stat-grid">
            <div class="stat">
              <span>RSB</span>
              <b>5</b>
            </div>

            <div class="stat">
              <span>Wefting</span>
              <b>4</b>
            </div>

            <div class="stat">
              <span>Curling</span>
              <b>6</b>
            </div>

            <div class="stat emphasis">
              <span>Ventilation</span>
              <b>3</b>
            </div>
          </div>

          <section class="panel">
            <h2>Daily production output</h2>

            <table>
              <thead>
                <tr>
                  <th>Team</th>
                  <th>Activity</th>
                  <th>Output</th>
                  <th>Update</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>RSB</td>
                  <td>Pairing / blending</td>
                  <td>120 units</td>
                  <td>
                    <span class="status ready">Recorded</span>
                  </td>
                </tr>

                <tr>
                  <td>Wefting</td>
                  <td>Bundle construction</td>
                  <td>34 units</td>
                  <td>
                    <span class="status ready">Recorded</span>
                  </td>
                </tr>

                <tr>
                  <td>Curling</td>
                  <td>Manila curls</td>
                  <td>48 units</td>
                  <td>
                    <span class="status progress">Ongoing</span>
                  </td>
                </tr>

                <tr>
                  <td>Ventilation</td>
                  <td>13×4 lace work</td>
                  <td>18 units</td>
                  <td>
                    <span class="status progress">Ongoing</span>
                  </td>
                </tr>
              </tbody>
            </table>

            <p class="module-note">
              Production staff can record updates for RSB, wefting, curling,
              ventilation, and overall production status.
            </p>
          </section>
        `;
      }

      if (tab === "qa") {
        content.innerHTML = `
          <div class="stat-grid">
            <div class="stat emphasis">
              <span>Pending inspection</span>
              <b>7</b>
            </div>

            <div class="stat">
              <span>Approved today</span>
              <b>15</b>
            </div>

            <div class="stat">
              <span>For rework</span>
              <b>2</b>
            </div>

            <div class="stat">
              <span>Pass rate</span>
              <b>93%</b>
            </div>
          </div>

          <section class="panel">
            <h2>QA inspection queue</h2>

            <table>
              <thead>
                <tr>
                  <th>Record</th>
                  <th>Inspection scope</th>
                  <th>Inspector</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>PR-24092</td>
                  <td>Length, texture, shedding</td>
                  <td>Unassigned</td>
                  <td>
                    <button
                      class="mini-add"
                      onclick="alert('Inspection record opened: Pass, Reject, or Send for Rework.')"
                    >
                      Inspect
                    </button>
                  </td>
                </tr>

                <tr>
                  <td>PR-24096</td>
                  <td>13×6 lace and density</td>
                  <td>QA Team</td>
                  <td>
                    <span class="status progress">In review</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </section>
        `;
      }

      if (tab === "or") {
        content.innerHTML = `
          <div class="stat-grid">
            <div class="stat">
              <span>Available ORs</span>
              <b>86</b>
            </div>

            <div class="stat">
              <span>Reserved</span>
              <b>9</b>
            </div>

            <div class="stat emphasis">
              <span>Issued this month</span>
              <b>42</b>
            </div>

            <div class="stat">
              <span>Voided</span>
              <b>1</b>
            </div>
          </div>

          <section class="panel">
            <h2>Recent OR activity</h2>

            <table>
              <thead>
                <tr>
                  <th>OR Number</th>
                  <th>Customer</th>
                  <th>Total</th>
                  <th>Status</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>OR-2026-1042</td>
                  <td>Client quotation</td>
                  <td>$462.00</td>
                  <td>
                    <span class="status ready">Issued</span>
                  </td>
                </tr>

                <tr>
                  <td>OR-2026-1043</td>
                  <td>Custom order</td>
                  <td>$635.00</td>
                  <td>
                    <span class="status progress">Reserved</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </section>
        `;
      }

      if (tab === "reports") {
        content.innerHTML = `
          <div class="content" style="margin-top: 25px">
            <section class="panel">
              <h2>Available reports</h2>

              <ul class="permission-list">
                <li>Inventory movement report</li>
                <li>Daily production output report</li>
                <li>QA approval and rejection report</li>
                <li>OR number utilization report</li>
                <li>Product availability report</li>
              </ul>
            </section>

            <section class="report-box">
              <h2 style="color: white; margin: 0">Monthly snapshot</h2>

              <p>
                Track finished goods, production output, QA results, and
                inventory trends in one export.
              </p>

              <button onclick="alert('Report export preview generated.')">
                Generate report
              </button>
            </section>
          </div>
        `;
      }

      if (tab === "users") {
        content.innerHTML = `
          <section class="panel" style="margin-top: 25px">
            <h2>Staff access</h2>

            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Role</th>
                  <th>Access status</th>
                </tr>
              </thead>

              <tbody>
                <tr>
                  <td>Owner account</td>
                  <td>Owner</td>
                  <td>
                    <span class="status ready">Active</span>
                  </td>
                </tr>

                <tr>
                  <td>Inventory staff</td>
                  <td>Inventory</td>
                  <td>
                    <span class="status ready">Active</span>
                  </td>
                </tr>

                <tr>
                  <td>Production staff</td>
                  <td>Production</td>
                  <td>
                    <span class="status ready">Active</span>
                  </td>
                </tr>

                <tr>
                  <td>QA inspector</td>
                  <td>QA</td>
                  <td>
                    <span class="status ready">Active</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </section>
        `;
      }
    }

    function logout() {
      sessionStorage.removeItem("sassyStrandsDemoRole");

      window.location.href = "sassy-strands-storefront-white.html";
    }

    renderNav();
    renderContent();
  </script>
</body>
</html>
